<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钢板视觉缺陷检测</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Steel Vision Inspection</p>
          <h1>钢板视觉缺陷检测</h1>
          <p class="subtext">从指定文件夹读取图片或视频，实时检测并展示正常/异常结果。</p>
        </div>
        <div class="health" id="healthStatus">模型状态检查中...</div>
      </header>

      <main class="layout">
        <section class="panel">
          <div class="panel-head">
            <h2>实时检测</h2>
            <div class="status-pill" id="liveState">未启动</div>
          </div>

          <div class="camera-stage">
            <img id="streamView" alt="检测画面" />
          </div>

          <div class="source-bar">
            <span class="source-label">读取目录：</span>
            <span id="sourceDirDisplay" class="source-path">加载中...</span>
          </div>

          <div class="source-bar">
            <button id="startStreamBtn">启动检测</button>
            <button id="stopStreamBtn" class="ghost">停止</button>
          </div>

          <div class="source-bar settings-bar">
            <span class="source-label">模糊过滤：</span>
            <label class="toggle-switch">
              <input type="checkbox" id="blurFilterToggle" checked />
              <span class="toggle-slider"></span>
            </label>
            <span id="blurFilterLabel" class="toggle-label">已启用</span>
          </div>

          <div class="actions">
            <span id="detectStatus">点击"启动检测"开始</span>
            <button id="refreshBtn" class="ghost">刷新历史</button>
          </div>

          <div class="summary" id="summary"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>检测历史</h2>
            <select id="historyFilter">
              <option value="">全部</option>
              <option value="true">仅异常</option>
              <option value="false">仅正常</option>
            </select>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>
      </main>
    </div>

    <script src="/app.js?v=4"></script>
  </body>
</html>
