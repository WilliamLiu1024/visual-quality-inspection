<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钢板视觉缺陷检测</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Steel Vision Inspection</p>
          <h1>钢板视觉缺陷检测</h1>
          <p class="subtext">支持测试集图片识别与实时视频流识别，前端展示正常/异常、异常框和置信度。</p>
        </div>
        <div class="health" id="healthStatus">模型状态检查中...</div>
      </header>

      <main class="layout">
        <section class="panel">
          <div class="panel-head">
            <h2>测试集图片识别</h2>
            <div class="status-pill" id="liveState">未启动</div>
          </div>

          <div class="source-bar">
            <select id="sampleImageSelect"></select>
            <button id="runSampleBtn">识别测试图</button>
          </div>

          <div class="camera-stage">
            <img id="streamView" alt="识别结果展示" />
          </div>

          <div class="source-bar">
            <input id="sourceInput" type="text" value="D:\05Data\visual-quality-inspection\data\test" placeholder="输入 data/test、摄像头索引或 RTSP 地址" />
            <button id="startStreamBtn">启动视频流</button>
            <button id="stopStreamBtn" class="ghost">停止</button>
          </div>

          <div class="actions">
            <span id="detectStatus">等待选择测试图或启动视频流</span>
            <button id="refreshBtn" class="ghost">刷新历史</button>
          </div>

          <div class="summary" id="summary"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>检测历史</h2>
            <select id="historyFilter">
              <option value="">全部</option>
              <option value="true">仅异常</option>
              <option value="false">仅正常</option>
            </select>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
